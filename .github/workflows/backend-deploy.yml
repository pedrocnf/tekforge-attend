name: backend-deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      EXPORTS_BUCKET: ${{ vars.GCP_EXPORTS_BUCKET }}
      ASSETS_BUCKET: ${{ vars.GCP_ASSETS_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY}/${DOCKER_IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$IMAGE_URI" backend

      - name: Push image
        run: docker push "$IMAGE_URI"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE"             --image "$IMAGE_URI"             --region "$REGION"             --platform managed             --allow-unauthenticated             --service-account "$RUNTIME_SA"             --set-env-vars "APP_ENV=prod,GCP_PROJECT_ID=${PROJECT_ID},EXPORTS_BUCKET=${EXPORTS_BUCKET},ASSETS_BUCKET=${ASSETS_BUCKET}"             --set-secrets "JWT_SECRET=tekattend-jwt-secret:latest,ADMIN_BOOTSTRAP_PASSWORD=tekattend-admin-bootstrap-password:latest"
