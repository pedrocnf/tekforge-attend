name: quality

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Smoke check backend tree
        run: |
          test -f Dockerfile || (echo "backend/Dockerfile não encontrado" && exit 1)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web deps
        run: |
          if [ -f package.json ]; then npm ci || npm install; else echo "package.json não encontrado ainda"; fi
      - name: Build web if possible
        run: |
          if [ -f package.json ]; then npm run build --if-present; fi

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Check mobile folder
        run: |
          test -f pubspec.yaml || (echo "mobile/pubspec.yaml não encontrado ainda" && exit 0)
